app = "your-finance-bot-name"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.bot"

[env]
  BACKEND_URL = "https://your-finance-backend-name.fly.dev"

# Sem [[services]] pois o bot é um worker, não expõe porta HTTP

# Restart policy: tenta sempre, sem limite. Bot tem sleep no startup que evita
# burst de restarts em erro de config (token invalido, etc).
[[restart]]
  policy = "always"
  retries = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
