name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          pip install pyinstaller pillow --quiet
          pip uninstall pathlib -y

      - name: Generate icon
        run: python tools/generate_icon.py

      - name: Build FinanceBotSetup.exe
        run: >
          pyinstaller --onefile --windowed --uac-admin
          --name "FinanceBotSetup" --clean
          --icon assets/icon.ico
          --add-data "assets;assets"
          wizard/setup_wizard.py

      - name: Build FinanceBotUpdate.exe
        run: >
          pyinstaller --onefile --windowed --uac-admin
          --name "FinanceBotUpdate" --clean
          --icon assets/icon.ico
          wizard/updater.py

      - name: Sign executables
        shell: pwsh
        run: |
          $certBase64 = "${{ secrets.CODE_SIGNING_CERT }}".TrimStart([char]0xFEFF).Trim()
          $certBytes = [Convert]::FromBase64String($certBase64)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $certBytes, "${{ secrets.CODE_SIGNING_PASSWORD }}",
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
          )
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Set-AuthenticodeSignature -FilePath "dist\FinanceBotSetup.exe" -Certificate $cert -HashAlgorithm SHA256
          Set-AuthenticodeSignature -FilePath "dist\FinanceBotUpdate.exe" -Certificate $cert -HashAlgorithm SHA256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FinanceBotSetup.exe
            dist/FinanceBotUpdate.exe
