services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  bot:
    build: ./bot
    env_file:
      - ./bot/.env
    depends_on:
      - backend
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - ./dashboard/.env.local
    depends_on:
      - backend
    restart: unless-stopped
